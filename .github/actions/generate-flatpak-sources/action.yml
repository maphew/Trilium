name: "Generate Flatpak sources"
description: "Runs flatpak-node-generator over pnpm-lock.yaml, producing upload/generated-sources.json"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 24

    # The generator caches registry metadata per package, so a prefix hit from
    # restore-keys spares re-fetching all ~2500 entries when a PR changes a few.
    - name: Cache generator metadata
      uses: actions/cache@v4
      with:
        path: ~/.cache/flatpak-node-generator
        key: flatpak-node-generator-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: flatpak-node-generator-

    - name: Install flatpak-node-generator
      shell: bash
      run: pipx install 'git+https://github.com/flatpak/flatpak-builder-tools.git#subdirectory=node'

    - name: Generate the sources
      shell: bash
      run: node --experimental-strip-types ./scripts/generate-flatpak-sources.mts
